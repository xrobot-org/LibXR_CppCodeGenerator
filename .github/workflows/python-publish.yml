name: CI/CD - Python Package

on:
  push:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
  pull_request:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-stm32-targets:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout STM32 Test Projects
        uses: actions/checkout@v4
        with:
          repository: Jiu-xiao/libxr_stm32_test
          path: test-project

      - name: Discover STM32 targets
        id: targets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          root = Path("test-project")
          targets = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          if not targets:
              raise SystemExit("No STM32 target directories found")

          print("matrix=" + json.dumps({"target": targets}, separators=(",", ":")))
          PY

  stm32-target-test:
    name: STM32 Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: discover-stm32-targets
    container:
      image: ghcr.io/xrobot-org/docker-image-stm32:main
      options: --user 0

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stm32-targets.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python Package
      run: |
        python ./scripts/gen_libxr_version.py
        pip install .

    - name: Compiler Version Check
      run: |
        arm-none-eabi-gcc --version
        starm-clang --version

    - name: Get Test Projects
      uses: actions/checkout@v4
      with:
        repository: Jiu-xiao/libxr_stm32_test
        path: test-project

    - name: Resolve matching LibXR ref
      id: libxr-ref
      shell: bash
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          ref="${GITHUB_REF_NAME}"
          if ! git ls-remote --exit-code --tags https://github.com/xrobot-org/libxr.git "refs/tags/${ref}" >/dev/null; then
            echo "Matching LibXR tag is required for coordinated release: ${ref}" >&2
            exit 1
          fi
        else
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if ! git ls-remote --exit-code --heads https://github.com/xrobot-org/libxr.git "refs/heads/${ref}" >/dev/null; then
            ref="dev"
          fi
        fi
        echo "Using LibXR ref: ${ref}"
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Run STM32 target test
      run: |
        cd test-project && ./test.sh "${{ steps.libxr-ref.outputs.ref }}" "${{ matrix.target }}"

  build:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 black build twine

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest flake8 black build twine

      - name: Build Package
        run: |
          python ./scripts/gen_libxr_version.py
          python -m build

      - name: Check Package Metadata
        run: |
          twine check dist/*

      - name: Rename built package files (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            if [[ -f "$file" ]]; then
              new_name=$(echo "$file" | sed -E "s/^dist\/libxr-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)$/dist\/libxr-\1-py\2-none-any.\3/")
              if [[ "$file" != "$new_name" ]]; then
                mv "$file" "$new_name"
              fi
            fi
          done
          ls -lh dist/

      - name: Rename built package files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/* -Include *.whl, *.tar.gz | ForEach-Object {
            $newName = $_.Name -replace '^libxr-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)', 'libxr-$1-py$2-none-any.$3'
            if ($_.Name -ne $newName) {
              Rename-Item -Path $_.FullName -NewName $newName
            }
          }
          Get-ChildItem -Path dist/

      - name: Upload Built Package
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

      - name: Install built package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pip install dist/*.whl || pip install dist/*.tar.gz

      - name: Install built package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.whl,dist\*.tar.gz | Select-Object -First 1
          if ($pkg) {
            pip install $pkg.FullName
          }

      - name: Candidate source regression tests
        run: python -m unittest discover -s tests -p test_static_integration.py -v

      - name: Import smoke check (all top-level modules)
        run: |
          python ./scripts/ci_import_smoke.py

      - name: CubeMX runner smoke check
        run: |
          python ./scripts/cubemx_runner_smoke.py

      - name: LibXR submodule policy smoke check
        run: |
          python ./scripts/libxr_submodule_smoke.py

      - name: Checkout BSP Compatibility Test Repo
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/bsp_stm32f103c8
          path: bsp_test

      - name: Python Compatibility Check (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd bsp_test
          xr_cubemx_cfg -d .

      - name: Python Compatibility Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location bsp_test
          xr_cubemx_cfg -d .

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
      - stm32-target-test
    if: github.event_name == 'release'

    permissions:
      id-token: write

    environment:
      name: XRobot
      url: https://pypi.org/project/libxr

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Move built packages to root dist/
        run: |
          find dist/ -mindepth 2 -type f -exec mv {} dist/ \;
          rm -rf dist/python-package-*  # 清理空文件夹
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          username: XRobot
          password: ${{ secrets.TOKEN }}
